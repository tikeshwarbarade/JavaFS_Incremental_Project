<nav class="navbar">
  <div class="brand" (click)="goToDashboard()">EduConnect</div>

  <div class="nav-links">
    <button
      *ngIf="role === 'TEACHER'"
      type="button"
      class="nav-link-button"
      (click)="goToCourseCreate()"
    >
      Add Course
    </button>

    <button
      type="button"
      class="nav-link-button"
      (click)="goToEnrollment()"
    >
      Add Enrollment
    </button>
  </div>

  <div class="nav-right">
    <span *ngIf="role === 'STUDENT'" class="welcome-text">
      {{ studentName || 'Student' }}
    </span>

    <span *ngIf="role === 'TEACHER'" class="welcome-text">
      {{ teacherName || 'Teacher' }}
    </span>

    <button type="button" class="logout-btn" (click)="logout()">
      Logout
    </button>
  </div>
</nav>
