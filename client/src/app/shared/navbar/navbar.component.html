<nav class="navbar navbar-expand-lg edu-navbar">
  <div class="container-fluid edu-navbar-container">
    <button
      type="button"
      class="navbar-brand edu-brand"
      (click)="goToDashboard()"
    >
      <span class="brand-icon">E</span>
      <span class="brand-text">EduConnect</span>
    </button>

    <div class="edu-nav-links">
      <button
        *ngIf="role === 'TEACHER'"
        type="button"
        class="edu-nav-link"
        (click)="goToCourseCreate()"
      >
        Add Course
      </button>

      <button
        type="button"
        class="edu-nav-link"
        (click)="goToEnrollment()"
      >
        Add Enrollment
      </button>
    </div>

    <div class="edu-nav-right">
      <span *ngIf="role === 'STUDENT'" class="user-chip">
        {{ studentName || 'Student' }}
      </span>

      <span *ngIf="role === 'TEACHER'" class="user-chip">
        {{ teacherName || 'Teacher' }}
      </span>

      <button
        type="button"
        class="logout-btn"
        (click)="logout()"
      >
        Logout
      </button>
    </div>
  </div>
</nav>
