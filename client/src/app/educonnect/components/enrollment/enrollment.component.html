<app-navbar></app-navbar>

<div class="page-wrapper">
  <div class="enrollment-container">
    <h2>Create Enrollment</h2>

    <form [formGroup]="enrollmentForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="courseId">Course</label>

        <select id="courseId" formControlName="courseId">
          <option value="">Select a Course</option>

          <option
            *ngFor="let course of availableCourses"
            [value]="course.courseId"
          >
            {{ course.courseName }}
          </option>
        </select>

        <div
          class="error"
          *ngIf="enrollmentForm.get('courseId')?.touched && enrollmentForm.get('courseId')?.errors?.['required']"
        >
          Course is required.
        </div>
      </div>

      <div class="form-group" *ngIf="role === 'TEACHER'">
        <label for="studentId">Student</label>

        <select id="studentId" formControlName="studentId">
          <option value="">Select a Student</option>

          <option
            *ngFor="let student of students"
            [value]="student.studentId"
          >
            {{ student.fullName }}
          </option>
        </select>

        <div
          class="error"
          *ngIf="enrollmentForm.get('studentId')?.touched && enrollmentForm.get('studentId')?.errors?.['required']"
        >
          Student is required.
        </div>
      </div>

      <div class="form-group" *ngIf="role === 'STUDENT'">
        <label>Student</label>

        <input
          type="text"
          [value]="currentStudentName"
          disabled
        />
      </div>

      <div class="form-group">
        <label for="enrollmentDate">Enrollment Date</label>

        <input
          id="enrollmentDate"
          type="date"
          formControlName="enrollmentDate"
        />

        <div
          class="error"
          *ngIf="enrollmentForm.get('enrollmentDate')?.touched && enrollmentForm.get('enrollmentDate')?.errors?.['required']"
        >
          Enrollment date is required.
        </div>
      </div>

      <div class="button-group">
        <button type="submit">
          Add Enrollment
        </button>
      </div>
    </form>

    <div class="dashboard-link">
      <a (click)="goToDashboard()">Dashboard</a>
    </div>

    <p class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </p>

    <p class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>
  </div>
</div>
