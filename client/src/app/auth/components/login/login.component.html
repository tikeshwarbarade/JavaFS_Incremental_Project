<div class="auth-page">
  <div class="login-card">
    <h2>Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Enter Username"
        />

        <div class="error" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.errors?.['required']">
          Username is required.
        </div>

        <div class="error" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.errors?.['pattern']">
          Username should not contain special characters.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter Password"
        />

        <div class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']">
          Password is required.
        </div>

        <div class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['minlength']">
          Password must be at least 8 characters long.
        </div>
      </div>

      <button type="submit">Login</button>
    </form>

    <p class="link-text">
      Don't have an account?
      <a routerLink="/auth/register">Sign up</a>
    </p>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
  </div>
</div>
